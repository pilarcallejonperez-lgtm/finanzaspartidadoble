<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traductor</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traductor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6b4a">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --fg:#26302a; --muted:#5f6b63; --line:#d9d3c4;
  --verde:#1f6b4a; --verde-fg:#ffffff; --rojo:#b8372f;
  --body:-apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141a16; --card:#1d2520; --fg:#eef1ec; --muted:#a8b3ab; --line:#33403a;
  --verde:#5cc08e; --verde-fg:#0f1a14; --rojo:#ee7c70; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20px;line-height:1.45;
  padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.7rem;margin:0;line-height:1.15}
.sub{color:var(--muted);margin:0;font-size:1.05rem}
.cambio{display:flex;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px}
.cambio button{flex:1;border:none;border-radius:12px;padding:14px 8px;font:inherit;font-size:1.05rem;font-weight:700;background:transparent;color:var(--muted)}
.cambio button[aria-pressed="true"]{background:var(--verde);color:var(--verde-fg)}
textarea{width:100%;min-height:150px;font:inherit;font-size:1.2rem;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;resize:vertical}
textarea:focus{outline:3px solid var(--verde);outline-offset:2px}
.fila{display:flex;gap:10px}
.sec{flex:1;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:1.05rem;font-weight:700}
.principal{min-height:70px;border:none;border-radius:18px;background:var(--verde);color:var(--verde-fg);font:inherit;font-size:1.35rem;font-weight:700}
.principal:disabled{opacity:.5}
.resultado{background:var(--card);border:3px solid var(--verde);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.resultado h2{margin:0;font-size:1rem;color:var(--verde);text-transform:uppercase;letter-spacing:.06em}
#salida{margin:0;font-size:1.3rem;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.copiar{min-height:58px;border:none;border-radius:14px;background:var(--fg);color:var(--bg);font:inherit;font-size:1.15rem;font-weight:700}
.error{color:var(--rojo)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>Traductor</h1>
    <p class="sub">Pega el mensaje y toca «Traducir».</p>
  </header>

  <div class="cambio" role="group" aria-label="Idioma">
    <button id="modoEs" type="button" aria-pressed="true">Malgache → Español</button>
    <button id="modoMg" type="button" aria-pressed="false">Español → Malgache</button>
  </div>

  <textarea id="texto" placeholder="Pega aquí el mensaje en malgache" aria-label="Mensaje"></textarea>

  <div class="fila">
    <button class="sec" id="pegar" type="button">📋 Pegar</button>
    <button class="sec" id="borrar" type="button">✕ Borrar</button>
  </div>

  <button class="principal" id="traducir" type="button">Traducir</button>

  <section class="resultado" id="resultado" hidden aria-live="polite">
    <h2 id="titulo">En español</h2>
    <p id="salida"></p>
    <button class="copiar" id="copiar" type="button">Copiar para WhatsApp</button>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let modo = 'es'; // 'es' = malgache→español ; 'mg' = español→malgache
function ponerModo(m){
  modo = m;
  $('modoEs').setAttribute('aria-pressed', m === 'es');
  $('modoMg').setAttribute('aria-pressed', m === 'mg');
  $('texto').placeholder = m === 'es' ? 'Pega aquí el mensaje en malgache' : 'Escribe aquí en español';
  $('resultado').hidden = true;
}
$('modoEs').onclick = () => ponerModo('es');
$('modoMg').onclick = () => ponerModo('mg');
$('borrar').onclick = () => { $('texto').value = ''; $('resultado').hidden = true; $('texto').focus(); };
$('pegar').onclick = async () => {
  try { $('texto').value = await navigator.clipboard.readText(); traducir(); }
  catch (e) { $('texto').focus(); }
};
async function traducir(){
  const s = $('texto').value.trim(); if (!s) { $('texto').focus(); return; }
  const [sl, tl] = modo === 'es' ? ['mg', 'es'] : ['es', 'mg'];
  $('traducir').disabled = true; $('traducir').textContent = 'Traduciendo…';
  $('resultado').hidden = false; $('salida').className = ''; $('salida').textContent = '…';
  $('titulo').textContent = modo === 'es' ? 'En español' : 'En malgache';
  try {
    const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(s);
    const r = await fetch(u); if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    $('salida').textContent = j[0].map(x => x[0]).join('');
    $('copiar').hidden = false;
  } catch (e) {
    $('salida').className = 'error';
    $('salida').textContent = 'No se ha podido traducir. Mira que tengas internet y vuelve a tocar «Traducir».';
    $('copiar').hidden = true;
  } finally { $('traducir').disabled = false; $('traducir').textContent = 'Traducir'; }
}
$('traducir').onclick = traducir;
$('copiar').onclick = async () => {
  try { await navigator.clipboard.writeText($('salida').textContent); $('copiar').textContent = '✓ Copiado. Ya puedes pegarlo'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('salida')); const g = getSelection(); g.removeAllRanges(); g.addRange(r); }
  setTimeout(() => { $('copiar').textContent = 'Copiar para WhatsApp'; }, 2500);
};
</script>
</body>
</html>
